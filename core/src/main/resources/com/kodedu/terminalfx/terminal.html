<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>terminal</title>
<style>/*XTERM_CSS*/</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  #screen { position: absolute; inset: 0; }
</style>
<style id="userCss"></style>
<style id="scrollbarCss"></style>
</head>
<body>
<div id="screen"></div>
<script>/*XTERM_JS*/</script>
<script>/*UNICODE_JS*/</script>
<script>
(function () {
  "use strict";

  var term = null;
  var look = null;
  var pendingWrites = 0;

  function colour(value) { return value; }

  // What key this is, in a WebView that often does not say.
  //
  // `KeyboardEvent.key` is the modern answer and the only one worth reading — except that the
  // events this page receives are synthesised by JavaFX from its own, and in this engine `key`
  // arrives empty for everything. Ctrl+C and Ctrl+V were compared against it, so neither
  // copied nor pasted; the embedder was handed an empty name for every keystroke it was asked
  // about. `keyCode` is deprecated everywhere and is what actually arrives here.
  function keyName(event) {
    if (event.key && event.key.length) { return event.key; }
    var code = event.keyCode || event.which || 0;
    if (code >= 112 && code <= 123) { return "F" + (code - 111); }
    if (code >= 65 && code <= 90) {
      var letter = String.fromCharCode(code);
      return event.shiftKey ? letter : letter.toLowerCase();
    }
    if (code >= 48 && code <= 57) { return String.fromCharCode(code); }
    switch (code) {
      case 8: return "Backspace";
      case 9: return "Tab";
      case 13: return "Enter";
      case 16: return "Shift";
      case 17: return "Control";
      case 18: return "Alt";
      case 27: return "Escape";
      case 32: return " ";
      case 33: return "PageUp";
      case 34: return "PageDown";
      case 35: return "End";
      case 36: return "Home";
      case 37: return "ArrowLeft";
      case 38: return "ArrowUp";
      case 39: return "ArrowRight";
      case 40: return "ArrowDown";
      case 45: return "Insert";
      case 46: return "Delete";
      case 91: case 93: return "Meta";
      default: return "";
    }
  }

  function options(l) {
    return {
      allowProposedApi: true,
      // The far end must not be able to write this machine's clipboard unless the embedder
      // turned that on. xterm.js asks before acting on OSC 52, and this is the answer.
      allowTransparency: false,
      cursorBlink: l.cursorBlink,
      fontFamily: l.fontFamily,
      fontSize: l.fontSize,
      scrollback: l.scrollback,
      scrollSensitivity: l.scrollMultiplier,
      // OSC 8 links. xterm.js's own answer to a click is window.confirm and window.open, which a
      // WebView answers with nothing: a link did nothing at all. Handed to the embedder instead,
      // on Ctrl+click as in other terminals, with the address on hover. allowNonHttpProtocols
      // stays off, so only http and https reach it.
      linkHandler: links,
      theme: {
        background: colour(l.background),
        foreground: colour(l.foreground),
        cursor: colour(l.cursor),
        cursorAccent: colour(l.background),
        selectionBackground: "rgba(128,128,160,0.4)"
      }
    };
  }

  // The page under the terminal wears the terminal's colour.
  //
  // A terminal is a whole number of rows and its box is not, so there is a strip at the bottom
  // between the last row and the edge -- and the page's own background shows through it. The
  // page's own background is white, whatever the terminal is wearing, which on a dark terminal
  // is a bright band across the bottom of the window. It was there in every screenshot anybody
  // took of this and nobody could say what it was.
  function paintThePage(l) {
    document.documentElement.style.background = l.background;
    document.body.style.background = l.background;
    document.getElementById("userCss").textContent = l.userCss || "";
    document.getElementById("scrollbarCss").textContent = l.scrollbarVisible ? "" :
      ".xterm .xterm-viewport { scrollbar-width: none; }" +
      ".xterm .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; }" +
      ".xterm .xterm-scrollable-element > .scrollbar { visibility: hidden !important; }";
  }

  // Ms in hex, and xterm's value for it: OSC 52 with the selection and the text as parameters.
  var MS = "4D73";
  var MS_VALUE = (function (value) {
    var hex = "";
    for (var i = 0; i < value.length; i++) {
      hex += ("0" + value.charCodeAt(i).toString(16).toUpperCase()).slice(-2);
    }
    return hex;
  })("\x1b]52;%p1%s;%p2%s\x07");

  var links = {
    activate: function (event, uri) {
      if (event && (event.ctrlKey || event.metaKey)) { bridge.link(String(uri)); }
    },
    hover: function (event, uri) { bridge.linkHovered(String(uri)); },
    leave: function () { bridge.linkHovered(""); }
  };
  window.tfxLinks = links;

  window.tfxStart = function (lookJson) {
    look = JSON.parse(lookJson);
    paintThePage(look);
    term = new Terminal(options(look));
    try {
      term.loadAddon(new Unicode11Addon.Unicode11Addon());
      term.unicode.activeVersion = "11";
    } catch (noUnicodeAddon) { /* widths fall back to version 6 */ }

    // What the person typed or pasted and what the terminal answers a program by itself (the
    // cursor's position, its device attributes) both come out of onData. xterm.js tells them
    // apart in one place: for typing, its core service fires onUserInput just before onData. An
    // embedder that hands typing round several terminals has to know which is which, or the
    // answer meant for one program is typed at every other prompt.
    var typing = false;
    term._core.coreService.onUserInput(function () { typing = true; });
    term.onData(function (data) {
      var typed = typing;
      typing = false;
      if (typed) { bridge.input(data); } else { bridge.reply(data); }
    });
    term.onBinary(function (data) { bridge.inputBinary(data); });
    term.onResize(function (event) { bridge.resized(event.cols, event.rows); });
    term.onBell(function () { bridge.bell(); });
    term.onTitleChange(function (title) { bridge.title(title); });
    term.onSelectionChange(function () {
      if (look.copyOnSelect) {
        var text = term.getSelection();
        if (text) {
          bridge.selected(text);
          if (look.clearSelectionAfterCopy) { term.clearSelection(); }
        }
      }
    });
    // OSC 52. xterm.js hands the request over rather than acting on it; the embedder decides.
    term.parser.registerOscHandler(52, function (payload) {
      if (!look.allowRemoteClipboard) { return true; }
      bridge.remoteClipboard(String(payload));
      return true;
    });

    // XTGETTCAP: a program asks what a terminfo name means here. Neovim asks for Ms, the
    // clipboard sequence, and uses OSC 52 only when the answer is OSC 52; with no answer, "+y
    // over SSH copied nothing. Answered while OSC 52 reaches the embedder, as xterm answers it.
    // Any other name gets no answer, as before.
    term.parser.registerDcsHandler({ intermediates: "+", final: "q" }, function (data) {
      if (!look.allowRemoteClipboard) { return true; }
      var names = String(data).split(";");
      for (var i = 0; i < names.length; i++) {
        if (names[i].toUpperCase() === MS) {
          bridge.reply("\x1bP1+r" + names[i] + "=" + MS_VALUE + "\x1b\\");
        }
      }
      return true;
    });

    // Keys the embedder claims. Everything else is the shell's.
    term.attachCustomKeyEventHandler(function (event) {
      if (event.type !== "keydown") { return true; }
      var name = keyName(event);
      var control = event.ctrlKey && !event.altKey && !event.metaKey;
      var command = event.metaKey && !event.ctrlKey && !event.altKey;
      // Ctrl+Shift+C and Ctrl+Shift+V are a Linux terminal's copy and paste whatever the look
      // says about the plain keys, which belong to the shell (^C, ^V). With Shift held the key
      // is "C"/"V", so neither used to match: the copy did nothing, and the paste fell to the
      // WebView's own, which typed the clipboard straight in past the embedder's preview.
      var shifted = control && event.shiftKey;
      var letter = name.length === 1 ? name.toLowerCase() : name;
      if ((control || command) && letter === "c" && (look.ctrlCCopies || shifted)) {
        if (term.hasSelection()) {
          bridge.selected(term.getSelection());
          if (look.clearSelectionAfterCopy) { term.clearSelection(); }
          return false;
        }
        if (shifted) { return false; }
      }
      if ((control || command) && letter === "v" && (look.ctrlVPastes || shifted)) {
        event.preventDefault();
        bridge.pasteRequested();
        return false;
      }
      if (bridge.claimsKey(name, event.ctrlKey, event.altKey, event.shiftKey,
                           event.metaKey)) {
        return false;
      }
      return true;
    });

    term.open(document.getElementById("screen"));
    // The page takes the box's size a frame after the box has it. A fit asked from Java before
    // then measures a page with no room in it and leaves a terminal two columns wide, and when
    // the box was sized before the page was ready nothing in Java asks again. The page's own
    // resize is when it has the room: fit then as well.
    window.addEventListener("resize", function () { window.tfxFit(); });
    window.tfxFit();
    bridge.ready();
  };

  window.tfxWrite = function (text) {
    if (!term) { return; }
    pendingWrites++;
    term.write(text, function () { pendingWrites--; });
  };

  window.tfxIdle = function () { return pendingWrites === 0; };

  // How many cells the box has room for, each way.
  //
  // The page's own, not @xterm/addon-fit. The addon divides the room by the renderer's cell
  // width, and that width is the row rounded to a whole pixel and divided by the columns the
  // terminal has at that moment -- so the answer depended on the answer before it. In 886 pixels,
  // with letters 8.4375 wide, a terminal 104 columns wide was told 104 (878 / 104 = 8.4423, and
  // 886 / 8.4423 = 104.95) and one 105 wide was told 105 (886 / 105 = 8.4381). A new terminal
  // comes up from the two columns of a page with no room yet, so at such a width it stopped one
  // column short and stayed there until its box was next resized; asking again changed nothing.
  //
  // What does not depend on the columns is the cell's own size in device pixels, and the
  // renderer's own rule for what n of them take: round(n * cell / dpr) CSS pixels. The count is
  // the most that rule lets into the room. The room is the box, less the terminal's padding and
  // the lane the renderer keeps for its scrollbar whenever there is scrollback to scroll.
  var SCROLLBAR_LANE = 14;

  function cellsIn(room, cell, dpr) {
    var n = Math.floor(room * dpr / cell);
    while (Math.round((n + 1) * cell / dpr) <= room) { n++; }
    while (n > 0 && Math.round(n * cell / dpr) > room) { n--; }
    return n;
  }

  function fitted() {
    var element = term.element;
    if (!element || !element.parentElement) { return null; }
    var cell = term._core._renderService.dimensions.device.cell;
    if (!(cell.width > 0) || !(cell.height > 0)) { return null; }
    var box = window.getComputedStyle(element.parentElement);
    var own = window.getComputedStyle(element);
    function pixels(style, name) { return parseInt(style.getPropertyValue(name), 10); }
    var width = Math.max(0, pixels(box, "width"))
              - pixels(own, "padding-left") - pixels(own, "padding-right")
              - (term.options.scrollback === 0 ? 0 : SCROLLBAR_LANE);
    var height = pixels(box, "height") - pixels(own, "padding-top") - pixels(own, "padding-bottom");
    if (isNaN(width) || isNaN(height)) { return null; }   // a box that is not laid out has no room to say
    var dpr = window.devicePixelRatio || 1;
    return { cols: Math.max(2, cellsIn(width, cell.width, dpr)),
             rows: Math.max(1, cellsIn(height, cell.height, dpr)) };
  }

  window.tfxFit = function () {
    if (!term) { return; }
    var size = fitted();
    if (!size || (size.cols === term.cols && size.rows === term.rows)) { return; }
    term._core._renderService.clear();
    term.resize(size.cols, size.rows);
  };

  window.tfxLook = function (lookJson) {
    if (!term) { return; }
    look = JSON.parse(lookJson);
    paintThePage(look);
    var next = options(look);
    term.options.cursorBlink = next.cursorBlink;
    term.options.fontFamily = next.fontFamily;
    term.options.fontSize = next.fontSize;
    term.options.scrollback = next.scrollback;
    term.options.scrollSensitivity = next.scrollSensitivity;
    term.options.theme = next.theme;
    window.tfxFit();
  };

  window.tfxSize = function () { return term ? term.cols + "x" + term.rows : "0x0"; };

  // The two modes that change what a keystroke means on the wire.
  //
  // A program running in the terminal turns these on and off as it likes -- an editor asks for
  // application cursor keys, a shell with bracketed paste asks for that -- so two terminals side
  // by side are routinely in different modes. Anything that means to send the same keystroke to
  // both has to ask each of them what it is in, rather than copying one's bytes to the other.
  window.tfxModes = function () {
    if (!term) { return "00"; }
    var modes = term.modes || {};
    return (modes.applicationCursorKeysMode ? "1" : "0")
         + (modes.bracketedPasteMode ? "1" : "0");
  };
  window.tfxSelection = function () { return term ? term.getSelection() : ""; };
  window.tfxSelectAll = function () { if (term) { term.selectAll(); } };
  window.tfxCopySelection = function () {
    if (!term) { return; }
    var text = term.getSelection();
    if (!text) { return; }
    bridge.selected(text);
    if (look.clearSelectionAfterCopy) { term.clearSelection(); }
  };
  window.tfxPaste = function (text) { if (term) { term.paste(text); } };
  window.tfxFocus = function () { if (term) { term.focus(); } };
  window.tfxClear = function () { if (term) { term.clear(); } };
  window.tfxScrollToBottom = function () { if (term) { term.scrollToBottom(); } };
  // Find, in one pass over the buffer.
  //
  // This runs on the thread that draws the window, so its work has to be bounded by what the
  // buffer holds. xterm.js's search addon looked a row at a time, and a row that carried on a
  // line from the row above sent it back up to the row the line began on, to read the whole line
  // again: the work grew with the square of the line's length. A minified file or a log line with
  // no breaks wraps over hundreds of rows, and one of 60,000 characters held the window for five
  // to ten seconds each time Find answered "not found". Here every line is read once, its rows
  // joined, and searched as one string.
  function lineFrom(buffer, head) {
    var rows = [];
    var starts = [];
    var length = 0;
    var row = head;
    var line = buffer.getLine(row);
    while (line) {
      var next = buffer.getLine(row + 1);
      var wraps = !!(next && next.isWrapped);
      var text = line.translateToString(!wraps);
      starts.push(length);
      rows.push(text);
      length += text.length;
      if (!wraps) { break; }
      row++;
      line = next;
    }
    return { head: head, last: row, text: rows.join(""), starts: starts };
  }

  function lineHeadOf(buffer, row) {
    while (row > 0) {
      var line = buffer.getLine(row);
      if (!line || !line.isWrapped) { break; }
      row--;
    }
    return row;
  }

  // A wide letter is one character and two cells, an empty cell is a space, and the second half of
  // a wide letter is nothing at all: where a match is in the text is not where it is on the screen.
  function cellOf(row, index) {
    var seen = 0;
    var cell;
    for (var x = 0; x < row.length; x++) {
      cell = row.getCell(x, cell);
      if (cell.getWidth() === 0) { continue; }
      if (seen >= index) { return x; }
      seen += cell.getChars().length || 1;
    }
    return row.length;
  }

  function indexOfCell(row, column) {
    var seen = 0;
    var cell;
    for (var x = 0; x < Math.min(column, row.length); x++) {
      cell = row.getCell(x, cell);
      if (cell.getWidth() === 0) { continue; }
      seen += cell.getChars().length || 1;
    }
    return seen;
  }

  function placeOf(buffer, read, index) {
    var part = read.starts.length - 1;
    while (part > 0 && read.starts[part] > index) { part--; }
    var row = read.head + part;
    return { row: row, column: cellOf(buffer.getLine(row), index - read.starts[part]) };
  }

  function indexIn(buffer, read, row, column) {
    return read.starts[row - read.head] + indexOfCell(buffer.getLine(row), column);
  }

  function escaped(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  // The first match at or after `from`, or the last one before `before`; -1 when there is none.
  function matchIn(text, pattern, from, before) {
    pattern.lastIndex = 0;
    var found = -1;
    var match;
    if (before === undefined) {
      pattern.lastIndex = from;
      match = pattern.exec(text);
      return match ? match.index : -1;
    }
    while ((match = pattern.exec(text)) !== null && match.index < before) {
      found = match.index;
      pattern.lastIndex = match.index + 1;
    }
    return found;
  }

  function show(buffer, read, index, length) {
    var start = placeOf(buffer, read, index);
    var end = placeOf(buffer, read, index + length);
    var cells = (end.row - start.row) * term.cols + (end.column - start.column);
    term.select(start.column, start.row, cells);
    if (start.row < buffer.viewportY || start.row >= buffer.viewportY + term.rows) {
      term.scrollToLine(Math.max(0, start.row - Math.floor(term.rows / 2)));
    }
  }

  window.tfxFind = function (text, forward) {
    if (!term || !text) { return false; }
    var buffer = term.buffer.active;
    var pattern = new RegExp(escaped(text), "gi");
    var lastRow = buffer.length - 1;
    var at = term.getSelectionPosition();
    var again = at && term.getSelection().toLowerCase() === text.toLowerCase();
    var row;
    var column;
    if (forward) {
      row = at ? (again ? at.end.y : at.start.y) : 0;
      column = at ? (again ? at.end.x : at.start.x) : 0;
    } else {
      row = at ? at.start.y : lastRow;
      column = at ? at.start.x : term.cols;
    }
    var first = lineFrom(buffer, lineHeadOf(buffer, Math.min(row, lastRow)));
    var offset = indexIn(buffer, first, Math.min(row, first.last), column);
    var read = first;
    var found;
    if (forward) {
      found = matchIn(read.text, pattern, offset);
      while (found < 0) {
        var head = read.last + 1 > lastRow ? 0 : read.last + 1;
        if (head === first.head) {
          // Round to the line it began in: anything at or after where it began was looked at.
          found = matchIn(first.text, pattern, 0);
          read = first;
          break;
        }
        read = lineFrom(buffer, head);
        found = matchIn(read.text, pattern, 0);
      }
    } else {
      found = matchIn(read.text, pattern, 0, offset);
      while (found < 0) {
        var previous = read.head === 0 ? lastRow : read.head - 1;
        read = lineFrom(buffer, lineHeadOf(buffer, previous));
        if (read.head === first.head) {
          found = matchIn(first.text, pattern, 0, first.text.length + 1);
          break;
        }
        found = matchIn(read.text, pattern, 0, read.text.length + 1);
      }
    }
    if (found < 0) { return false; }
    show(buffer, read, found, text.length);
    return true;
  };
  window.tfxScrollbackLines = function () {
    return term ? term.buffer.active.length - term.rows : 0;
  };
  window.tfxScreenText = function () {
    if (!term) { return ""; }
    var buffer = term.buffer.active;
    var lines = [];
    for (var i = 0; i < term.rows; i++) {
      var line = buffer.getLine(buffer.viewportY + i);
      lines.push(line ? line.translateToString(true) : "");
    }
    return lines.join("\n");
  };
})();
</script>
</body>
</html>
