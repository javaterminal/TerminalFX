<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>terminal</title>
<style>/*XTERM_CSS*/</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  #screen { position: absolute; inset: 0; }
  /*USER_CSS*/
</style>
</head>
<body>
<div id="screen"></div>
<script>/*XTERM_JS*/</script>
<script>/*FIT_JS*/</script>
<script>/*SEARCH_JS*/</script>
<script>/*UNICODE_JS*/</script>
<script>
(function () {
  "use strict";

  var term = null;
  var fit = null;
  var search = null;
  var look = null;
  var pendingWrites = 0;

  function colour(value) { return value; }

  // What key this is, in a WebView that often does not say.
  //
  // `KeyboardEvent.key` is the modern answer and the only one worth reading — except that the
  // events this page receives are synthesised by JavaFX from its own, and in this engine `key`
  // arrives empty for everything. Ctrl+C and Ctrl+V were compared against it, so neither
  // copied nor pasted; the embedder was handed an empty name for every keystroke it was asked
  // about. `keyCode` is deprecated everywhere and is what actually arrives here.
  function keyName(event) {
    if (event.key && event.key.length) { return event.key; }
    var code = event.keyCode || event.which || 0;
    if (code >= 112 && code <= 123) { return "F" + (code - 111); }
    if (code >= 65 && code <= 90) {
      var letter = String.fromCharCode(code);
      return event.shiftKey ? letter : letter.toLowerCase();
    }
    if (code >= 48 && code <= 57) { return String.fromCharCode(code); }
    switch (code) {
      case 8: return "Backspace";
      case 9: return "Tab";
      case 13: return "Enter";
      case 16: return "Shift";
      case 17: return "Control";
      case 18: return "Alt";
      case 27: return "Escape";
      case 32: return " ";
      case 33: return "PageUp";
      case 34: return "PageDown";
      case 35: return "End";
      case 36: return "Home";
      case 37: return "ArrowLeft";
      case 38: return "ArrowUp";
      case 39: return "ArrowRight";
      case 40: return "ArrowDown";
      case 45: return "Insert";
      case 46: return "Delete";
      case 91: case 93: return "Meta";
      default: return "";
    }
  }

  function options(l) {
    return {
      allowProposedApi: true,
      // The far end must not be able to write this machine's clipboard unless the embedder
      // turned that on. xterm.js asks before acting on OSC 52, and this is the answer.
      allowTransparency: false,
      cursorBlink: l.cursorBlink,
      fontFamily: l.fontFamily,
      fontSize: l.fontSize,
      scrollback: l.scrollback,
      scrollSensitivity: l.scrollMultiplier,
      theme: {
        background: colour(l.background),
        foreground: colour(l.foreground),
        cursor: colour(l.cursor),
        cursorAccent: colour(l.background),
        selectionBackground: "rgba(128,128,160,0.4)"
      }
    };
  }

  // The page under the terminal wears the terminal's colour.
  //
  // A terminal is a whole number of rows and its box is not, so there is a strip at the bottom
  // between the last row and the edge -- and the page's own background shows through it. The
  // page's own background is white, whatever the terminal is wearing, which on a dark terminal
  // is a bright band across the bottom of the window. It was there in every screenshot anybody
  // took of this and nobody could say what it was.
  function paintThePage(l) {
    document.documentElement.style.background = l.background;
    document.body.style.background = l.background;
  }

  window.tfxStart = function (lookJson) {
    look = JSON.parse(lookJson);
    paintThePage(look);
    term = new Terminal(options(look));
    fit = new FitAddon.FitAddon();
    search = new SearchAddon.SearchAddon();
    term.loadAddon(fit);
    term.loadAddon(search);
    try {
      term.loadAddon(new Unicode11Addon.Unicode11Addon());
      term.unicode.activeVersion = "11";
    } catch (noUnicodeAddon) { /* widths fall back to version 6 */ }

    term.onData(function (data) { bridge.input(data); });
    term.onBinary(function (data) { bridge.inputBinary(data); });
    term.onResize(function (event) { bridge.resized(event.cols, event.rows); });
    term.onBell(function () { bridge.bell(); });
    term.onTitleChange(function (title) { bridge.title(title); });
    term.onSelectionChange(function () {
      if (look.copyOnSelect) {
        var text = term.getSelection();
        if (text) {
          bridge.selected(text);
          if (look.clearSelectionAfterCopy) { term.clearSelection(); }
        }
      }
    });
    // OSC 52. xterm.js hands the request over rather than acting on it; the embedder decides.
    term.parser.registerOscHandler(52, function (payload) {
      if (!look.allowRemoteClipboard) { return true; }
      bridge.remoteClipboard(String(payload));
      return true;
    });

    // Keys the embedder claims. Everything else is the shell's.
    term.attachCustomKeyEventHandler(function (event) {
      if (event.type !== "keydown") { return true; }
      var name = keyName(event);
      var control = event.ctrlKey && !event.altKey && !event.metaKey;
      var command = event.metaKey && !event.ctrlKey && !event.altKey;
      // Ctrl+Shift+C and Ctrl+Shift+V are a Linux terminal's copy and paste whatever the look
      // says about the plain keys, which belong to the shell (^C, ^V). With Shift held the key
      // is "C"/"V", so neither used to match: the copy did nothing, and the paste fell to the
      // WebView's own, which typed the clipboard straight in past the embedder's preview.
      var shifted = control && event.shiftKey;
      var letter = name.length === 1 ? name.toLowerCase() : name;
      if ((control || command) && letter === "c" && (look.ctrlCCopies || shifted)) {
        if (term.hasSelection()) {
          bridge.selected(term.getSelection());
          if (look.clearSelectionAfterCopy) { term.clearSelection(); }
          return false;
        }
        if (shifted) { return false; }
      }
      if ((control || command) && letter === "v" && (look.ctrlVPastes || shifted)) {
        event.preventDefault();
        bridge.pasteRequested();
        return false;
      }
      if (bridge.claimsKey(name, event.ctrlKey, event.altKey, event.shiftKey,
                           event.metaKey)) {
        return false;
      }
      return true;
    });

    term.open(document.getElementById("screen"));
    // The page takes the box's size a frame after the box has it. A fit asked from Java before
    // then measures a page with no room in it and leaves a terminal two columns wide, and when
    // the box was sized before the page was ready nothing in Java asks again. The page's own
    // resize is when it has the room: fit then as well.
    window.addEventListener("resize", function () { window.tfxFit(); });
    window.tfxFit();
    bridge.ready();
  };

  window.tfxWrite = function (text) {
    if (!term) { return; }
    pendingWrites++;
    term.write(text, function () { pendingWrites--; });
  };

  window.tfxIdle = function () { return pendingWrites === 0; };

  window.tfxFit = function () {
    if (!term || !fit) { return; }
    try { fit.fit(); } catch (tooSmall) { /* a zero-sized view has no size to report */ }
  };

  window.tfxLook = function (lookJson) {
    if (!term) { return; }
    look = JSON.parse(lookJson);
    paintThePage(look);
    var next = options(look);
    term.options.cursorBlink = next.cursorBlink;
    term.options.fontFamily = next.fontFamily;
    term.options.fontSize = next.fontSize;
    term.options.scrollback = next.scrollback;
    term.options.scrollSensitivity = next.scrollSensitivity;
    term.options.theme = next.theme;
    document.getElementById("userCss").textContent = look.userCss || "";
    window.tfxFit();
  };

  window.tfxSize = function () { return term ? term.cols + "x" + term.rows : "0x0"; };

  // The two modes that change what a keystroke means on the wire.
  //
  // A program running in the terminal turns these on and off as it likes -- an editor asks for
  // application cursor keys, a shell with bracketed paste asks for that -- so two terminals side
  // by side are routinely in different modes. Anything that means to send the same keystroke to
  // both has to ask each of them what it is in, rather than copying one's bytes to the other.
  window.tfxModes = function () {
    if (!term) { return "00"; }
    var modes = term.modes || {};
    return (modes.applicationCursorKeysMode ? "1" : "0")
         + (modes.bracketedPasteMode ? "1" : "0");
  };
  window.tfxSelection = function () { return term ? term.getSelection() : ""; };
  window.tfxSelectAll = function () { if (term) { term.selectAll(); } };
  window.tfxPaste = function (text) { if (term) { term.paste(text); } };
  window.tfxFocus = function () { if (term) { term.focus(); } };
  window.tfxClear = function () { if (term) { term.clear(); } };
  window.tfxScrollToBottom = function () { if (term) { term.scrollToBottom(); } };
  window.tfxFind = function (text, forward) {
    if (!term || !search) { return false; }
    return forward ? search.findNext(text) : search.findPrevious(text);
  };
  window.tfxClearFind = function () { if (search) { search.clearDecorations(); } };
  window.tfxScrollbackLines = function () {
    return term ? term.buffer.active.length - term.rows : 0;
  };
  window.tfxScreenText = function () {
    if (!term) { return ""; }
    var buffer = term.buffer.active;
    var lines = [];
    for (var i = 0; i < term.rows; i++) {
      var line = buffer.getLine(buffer.viewportY + i);
      lines.push(line ? line.translateToString(true) : "");
    }
    return lines.join("\n");
  };
})();
</script>
<style id="userCss">/*USER_STYLE*/</style>
</body>
</html>
